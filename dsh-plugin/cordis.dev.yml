# Development patch layer for dsh-leek-fund.
#
# Load the plugin from this checkout's built bundle without installing it into a
# profile:
#
#   npm run bundle                                                  # tsdown first
#   dsh web --patch /absolute/path/to/leek-fund/dsh-plugin/cordis.dev.yml
#
# `./lib/index.js` is anchored to THIS file by the CLI (relative `name` entries
# in a patch list resolve against the patch's own directory), so the file needs
# no absolute path and no placeholder. Keep `--patch` right after `web`, before
# any app flag: `dsh web --port 3199 --patch …` is rejected as an unknown option,
# because the `web` command passes unknown options straight to the app.
#
# The client half is always served from `lib/client.js`, so a change under
# `src/client/**` needs `npm run bundle` too. Loading from `src/index.ts`
# instead would need a tsx loader (`src/**` imports `./api.js` while only
# `.ts` sources exist) — `pnpm dsh` from the harness checkout has one
# preloaded; the plain published CLI needs `NODE_OPTIONS="--import tsx"`.
- insert:
    - id: leek-fund
      name: './lib/index.js'
