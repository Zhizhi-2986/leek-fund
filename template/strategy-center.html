<!DOCTYPE html>
<html lang="zh-cmn-Hans">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>策略中心</title>
    <link rel="stylesheet" href="styles/strategy-center.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <h1>策略中心</h1>
          <p id="summaryText">加载中...</p>
        </div>
        <button id="runSelectionBtn" class="primary-btn" type="button">立即选股</button>
      </header>

      <main class="content">
        <section class="panel panel--wide">
          <div class="panel__head">
            <h2>推荐 A 股列表</h2>
            <span id="recommendUpdatedAt" class="muted"></span>
          </div>
          <div id="marketReason" class="notice"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>代码</th>
                  <th>名称</th>
                  <th>现价</th>
                  <th>止损</th>
                  <th>目标</th>
                  <th>盈亏比</th>
                  <th>命中原因</th>
                  <th>人工核验</th>
                </tr>
              </thead>
              <tbody id="recommendTableBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="panel__head">
            <h2>持仓股</h2>
            <span class="muted">保存后同步到行情池</span>
          </div>
          <form id="holdingForm" class="holding-form">
            <input name="code" placeholder="代码 sh600000" required />
            <input name="name" placeholder="名称，可选" />
            <input name="costPrice" type="number" step="0.001" min="0" placeholder="成本价" required />
            <input name="shares" type="number" step="1" min="0" placeholder="数量" required />
            <input name="buyDate" type="date" />
            <input name="stopLossPrice" type="number" step="0.001" min="0" placeholder="止损价，可选" />
            <input name="targetPrice" type="number" step="0.001" min="0" placeholder="目标价，可选" />
            <button class="primary-btn" type="submit">保存持仓</button>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>代码</th>
                  <th>名称</th>
                  <th>成本</th>
                  <th>数量</th>
                  <th>买入日</th>
                  <th>止损</th>
                  <th>目标</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="holdingTableBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="panel__head">
            <h2>账户参数</h2>
            <span class="muted">用于熔断和仓位计算</span>
          </div>
          <form id="accountForm" class="account-form">
            <label>
              <span>总资产</span>
              <input name="totalAsset" type="number" step="0.01" min="0" placeholder="为空则按持仓市值估算" />
            </label>
            <label>
              <span>本月收益率</span>
              <input name="monthLossPercent" type="number" step="0.01" placeholder="亏损填负数，如 -3.5" />
            </label>
            <button class="primary-btn" type="submit">保存账户参数</button>
          </form>
        </section>

        <section class="panel panel--wide">
          <div class="panel__head">
            <h2>持仓策略监控</h2>
            <span id="monitorUpdatedAt" class="muted"></span>
          </div>
          <div id="accountMonitor" class="notice"></div>
          <div id="holdingMonitorList" class="monitor-list"></div>
        </section>

        <section class="panel panel--wide">
          <div class="panel__head">
            <h2>策略描述</h2>
            <span class="muted">统一规则来源</span>
          </div>
          <div id="strategyDescription" class="strategy-description"></div>
        </section>
      </main>
    </div>

    <script src="scripts/strategy-center.js"></script>
  </body>
</html>
